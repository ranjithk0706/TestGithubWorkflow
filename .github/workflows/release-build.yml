name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"

      tag:
        description: "Git tag"
        required: true
        default: "v1.0.0"

      environment:
        description: "Deployment environment"
        required: true
        default: "test"

jobs:
  release-build:
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ENVIRONMENT: ${{ inputs.environment }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW: "deploy.yml"
      JIRA_URL: "https://ranjith-kumar-a.atlassian.net"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download central Jira project configuration
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          curl -L \
            -H "Authorization: Bearer $CONFIG_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ranjithk0706/github-deployment-config/contents/jira-projects.yml \
            -o config-response.json

          python - <<'PY'
          import json
          import base64

          with open("config-response.json", "r") as f:
              data = json.load(f)

          if "content" not in data:
              print("Failed to download jira-projects.yml")
              print(data)
              raise SystemExit(1)

          content = base64.b64decode(data["content"]).decode("utf-8")

          with open("jira-projects.yml", "w") as f:
              f.write(content)

          print("Central Jira configuration:")
          print(content)
          PY

      - name: Show release variables
        run: |
          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Environment: $ENVIRONMENT"
          echo "Repository: $REPOSITORY"
          echo "Workflow: $WORKFLOW"

      - name: Install Python dependencies
        run: |
          python -m pip install requests pyyaml

      - name: Run Python release script
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python create_release.py
