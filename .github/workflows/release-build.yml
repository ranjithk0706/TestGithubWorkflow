name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        default: "1.0.0"

      tag:
        description: "Git tag"
        required: true
        type: string
        default: "v1.0.0"

      environment:
        description: "Deployment environment"
        required: true
        type: string
        default: "test"

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Create Jira Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ENVIRONMENT: ${{ inputs.environment }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW: "deploy.yml"
      JIRA_URL: "https://ranjith-kumar-a.atlassian.net"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download central Jira project configuration
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CONFIG_REPO_TOKEN}" ]]; then
            echo "::error::CONFIG_REPO_TOKEN secret is not configured."
            exit 1
          fi

          CONFIG_URL="https://api.github.com/repos/ranjithk0706/github-deployment-config/contents/jira-projects.yml"

          echo "Downloading central Jira project configuration..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --header "Authorization: Bearer ${CONFIG_REPO_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${CONFIG_URL}" \
            --output config-response.json

          python - <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          response_file = Path("config-response.json")
          output_file = Path("jira-projects.yml")

          try:
              data = json.loads(
                  response_file.read_text(encoding="utf-8")
              )
          except (OSError, json.JSONDecodeError) as exc:
              print(
                  f"ERROR: Unable to read GitHub API response: {exc}"
              )
              sys.exit(1)

          content = data.get("content")

          if not content:
              print(
                  "ERROR: GitHub API response does not contain "
                  "file content."
              )
              print(json.dumps(data, indent=2))
              sys.exit(1)

          try:
              decoded_content = base64.b64decode(
                  content.replace("\n", "")
              ).decode("utf-8")
          except (ValueError, UnicodeDecodeError) as exc:
              print(
                  f"ERROR: Unable to decode jira-projects.yml: {exc}"
              )
              sys.exit(1)

          try:
              output_file.write_text(
                  decoded_content,
                  encoding="utf-8"
              )
          except OSError as exc:
              print(
                  f"ERROR: Unable to write {output_file}: {exc}"
              )
              sys.exit(1)

          print(
              "Central Jira configuration downloaded successfully."
          )
          PY

      - name: Validate release variables
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERSION}" ]]; then
            echo "::error::VERSION cannot be empty."
            exit 1
          fi

          if [[ -z "${TAG}" ]]; then
            echo "::error::TAG cannot be empty."
            exit 1
          fi

          if [[ -z "${ENVIRONMENT}" ]]; then
            echo "::error::ENVIRONMENT cannot be empty."
            exit 1
          fi

          if [[ -z "${REPOSITORY}" ]]; then
            echo "::error::REPOSITORY cannot be empty."
            exit 1
          fi

          if [[ -z "${WORKFLOW}" ]]; then
            echo "::error::WORKFLOW cannot be empty."
            exit 1
          fi

          echo "Release variables validated successfully."

      - name: Show release variables
        run: |
          echo "========================================"
          echo "Release Configuration"
          echo "========================================"
          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"
          echo "Environment: ${ENVIRONMENT}"
          echo "Repository: ${REPOSITORY}"
          echo "Workflow: ${WORKFLOW}"
          echo "========================================"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3" "PyYAML>=6.0,<7"

      - name: Run Python release script
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python create_release.py
